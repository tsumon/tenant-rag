[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tenant-rag"
version = "0.3.0"
description = "SQLite-backed tenant-scoped hybrid retrieval for small AI applications"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "tenant-rag contributors"}]
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.urls]
Repository = "https://github.com/tsumon/tenant-rag"

[project.scripts]
tenant-rag = "tenantrag.server:main"
tenant-rag-admin = "admin.admin_server:main"

[tool.setuptools]
packages = ["tenantrag", "admin", "admin.static"]

[tool.setuptools.package-data]
"admin.static" = ["*.html"]
