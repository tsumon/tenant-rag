name: test-and-package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  real-model-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU model dependencies
        run: |
          python -m pip install 'torch==2.13.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r examples/local_trial/requirements-local.txt
      - name: Download and verify official immutable trial inputs
        run: |
          python examples/local_trial/scripts/download_assets.py --model-dir "$RUNNER_TEMP/trial-model"
          python -m pip install --no-deps examples/local_trial/wheel/tenant_rag-0.5.0-py3-none-any.whl
      - name: Verify retained evidence and example mechanics
        working-directory: examples/local_trial
        run: |
          unset PYTHONPATH
          python verify_evidence.py
          python -m unittest discover -s tests -v
      - name: Run actual offline local-model scenario
        working-directory: examples/local_trial
        run: |
          unset PYTHONPATH
          python run_trial.py --model-dir "$RUNNER_TEMP/trial-model" --output "$RUNNER_TEMP/trial-report.json"
      - uses: actions/upload-artifact@v4
        with:
          name: real-model-trial-report
          path: |
            ${{ runner.temp }}/trial-report.json
            ${{ runner.temp }}/trial-report.timing.json
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify SQLite trigram support
        run: python -c "import sqlite3; sqlite3.connect(':memory:').execute(\"CREATE VIRTUAL TABLE probe USING fts5(text, tokenize='trigram')\")"
      - run: python -m unittest discover -v
      - run: python eval/run_eval.py --k 3 --min-recall 0.8 --min-mrr 0.7
      - run: python demo/run_demo.py
      - name: Verify retained evaluation evidence
        run: python scripts/verify_evidence.py
      - name: Build distribution
        run: |
          python -m pip install build==1.3.0
          python -m build
      - name: Smoke test installed wheel outside checkout
        run: |
          python -m venv /tmp/tenant-rag-smoke
          /tmp/tenant-rag-smoke/bin/pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/tenant-rag-smoke/bin/tenant-rag --help
          /tmp/tenant-rag-smoke/bin/tenant-rag-admin --help
          /tmp/tenant-rag-smoke/bin/python -c "from importlib.resources import files; from tenantrag import TenantRAG; assert files('admin').joinpath('static/index.html').is_file(); r=TenantRAG(':memory:'); r.register('smoke','smoke-test-key'); r.index('smoke-test-key','release smoke test'); assert r.search('smoke-test-key','release'); r.close()"
          /tmp/tenant-rag-smoke/bin/python -I "$GITHUB_WORKSPACE/scripts/smoke_installed.py"
          /tmp/tenant-rag-smoke/bin/python -I "$GITHUB_WORKSPACE/scripts/smoke_v04.py"
      - name: Smoke test installed source distribution outside checkout
        run: |
          python -m venv /tmp/tenant-rag-source
          /tmp/tenant-rag-source/bin/pip install --no-deps dist/*.tar.gz
          cd /tmp
          /tmp/tenant-rag-source/bin/python -I "$GITHUB_WORKSPACE/scripts/smoke_installed.py"
          /tmp/tenant-rag-source/bin/python -I "$GITHUB_WORKSPACE/scripts/smoke_v04.py"
