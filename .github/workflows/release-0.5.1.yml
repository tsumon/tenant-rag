# One-time publication explicitly authorized for v0.5.1.
# Later versions need their own reviewed, authorized release change.
name: publish-v0.5.1
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-0.5.1.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: publish-v0.5.1
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -v
      - run: python eval/run_eval.py --k 3 --min-recall 0.8 --min-mrr 0.7
      - run: python demo/run_demo.py
      - run: python scripts/verify_evidence.py
      - run: python examples/local_trial/verify_evidence.py
      - run: python -m pip install build==1.3.0 && python -m build
      - name: Verify installed wheel and source distribution
        run: |
          python -m venv /tmp/tenant-wheel
          /tmp/tenant-wheel/bin/pip install --no-deps dist/*.whl
          /tmp/tenant-wheel/bin/python -I "$GITHUB_WORKSPACE/scripts/smoke_installed.py"
          /tmp/tenant-wheel/bin/python -I "$GITHUB_WORKSPACE/scripts/smoke_v04.py"
          python -m venv /tmp/tenant-source
          /tmp/tenant-source/bin/pip install --no-deps dist/*.tar.gz
          /tmp/tenant-source/bin/python -I "$GITHUB_WORKSPACE/scripts/smoke_installed.py"
          /tmp/tenant-source/bin/python -I "$GITHUB_WORKSPACE/scripts/smoke_v04.py"
  verify-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce the pinned real-model trial before publication
        working-directory: examples/local_trial
        run: |
          unset PYTHONPATH
          python -m pip install 'torch==2.13.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-local.txt
          python scripts/download_assets.py --model-dir "$RUNNER_TEMP/trial-model"
          python -m pip install --no-deps wheel/tenant_rag-0.5.0-py3-none-any.whl
          python verify_evidence.py
          python -m unittest discover -s tests -v
          python run_trial.py --model-dir "$RUNNER_TEMP/trial-model" --output "$RUNNER_TEMP/trial-report.json"
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [verify, verify-trial]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refuse an existing release or tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/git/matching-refs/tags/v0.5.1" --jq length)" = 0
          gh release list --limit 100 --json tagName > /tmp/releases.json
          python -c "import json; assert not any(r['tagName']=='v0.5.1' for r in json.load(open('/tmp/releases.json')))"
      - name: Build release assets at this exact commit
        run: |
          python -c "import tomllib; assert tomllib.load(open('pyproject.toml','rb'))['project']['version'] == '0.5.1'"
          python -m pip install build==1.3.0
          python examples/local_trial/verify_evidence.py
          python -m build
          python eval/run_eval.py --k 3 --min-recall 0.8 --min-mrr 0.7 --json --output dist/offline-eval.json
          { python scripts/verify_evidence.py; python examples/local_trial/verify_evidence.py; } > dist/evidence-verification.txt
          cat dist/evidence-verification.txt
          printf '%s\n' "$GITHUB_SHA" > dist/SOURCE_COMMIT.txt
          cd dist
          sha256sum tenant_rag-0.5.1-py3-none-any.whl tenant_rag-0.5.1.tar.gz offline-eval.json evidence-verification.txt SOURCE_COMMIT.txt > SHA256SUMS
      - name: Upload draft assets and download them for verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.5.1 dist/* --draft --target "$GITHUB_SHA" --title "tenant-rag 0.5.1" --notes-file docs/RELEASE_0.5.1.md
          RELEASE_ID=$(gh release view v0.5.1 --json databaseId --jq .databaseId)
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" > /tmp/original-draft.json
          python -c "import json,os; r=json.load(open('/tmp/original-draft.json')); assert r['draft'] and r['tag_name']=='v0.5.1' and r['target_commitish']==os.environ['GITHUB_SHA']"
          mkdir /tmp/release-download
          gh release download v0.5.1 --dir /tmp/release-download
          cmp dist/SHA256SUMS /tmp/release-download/SHA256SUMS
          env -u GH_TOKEN python scripts/verify_release_download.py /tmp/release-download "$GITHUB_SHA" 0.5.1
      - name: Install and smoke test the downloaded draft without release credentials
        run: |
          python -m venv /tmp/download-wheel
          /tmp/download-wheel/bin/pip install --no-deps /tmp/release-download/*.whl
          /tmp/download-wheel/bin/python -I "$GITHUB_WORKSPACE/scripts/smoke_installed.py"
          /tmp/download-wheel/bin/python -I "$GITHUB_WORKSPACE/scripts/smoke_v04.py"
          python -m venv /tmp/download-source
          /tmp/download-source/bin/pip install --no-deps /tmp/release-download/*.tar.gz
          /tmp/download-source/bin/python -I "$GITHUB_WORKSPACE/scripts/smoke_installed.py"
          /tmp/download-source/bin/python -I "$GITHUB_WORKSPACE/scripts/smoke_v04.py"
      - name: Publish only the verified draft and check public assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          RELEASE_ID=$(python -c "import json; print(json.load(open('/tmp/original-draft.json'))['id'])")
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" > /tmp/current-draft.json
          python -c "import json,os; a=json.load(open('/tmp/original-draft.json')); b=json.load(open('/tmp/current-draft.json')); assert a['id']==b['id'] and b['draft'] and b['tag_name']=='v0.5.1' and b['target_commitish']==os.environ['GITHUB_SHA']"
          gh api "repos/$GH_REPO/git/matching-refs/tags/v0.5.1" > /tmp/current-tags.json
          python -c "import json,os; r=json.load(open('/tmp/current-tags.json')); assert not r or (len(r)==1 and r[0]['ref']=='refs/tags/v0.5.1' and r[0]['object']['type']=='commit' and r[0]['object']['sha']==os.environ['GITHUB_SHA'])"
          mkdir /tmp/prepublish-download
          gh release download v0.5.1 --dir /tmp/prepublish-download
          cmp dist/SHA256SUMS /tmp/prepublish-download/SHA256SUMS
          env -u GH_TOKEN python scripts/verify_release_download.py /tmp/prepublish-download "$GITHUB_SHA" 0.5.1
          gh api --method PATCH "repos/$GH_REPO/releases/$RELEASE_ID" -F draft=false -f make_latest=true > /tmp/published-release.json
          python -c "import json,os; a=json.load(open('/tmp/original-draft.json')); b=json.load(open('/tmp/published-release.json')); assert a['id']==b['id'] and not b['draft'] and b['tag_name']=='v0.5.1' and b['target_commitish']==os.environ['GITHUB_SHA']"
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.5.1" --jq .object.sha)" = "$GITHUB_SHA"
          mkdir /tmp/public-release-download
          gh release download v0.5.1 --dir /tmp/public-release-download
          cmp dist/SHA256SUMS /tmp/public-release-download/SHA256SUMS
          env -u GH_TOKEN python scripts/verify_release_download.py /tmp/public-release-download "$GITHUB_SHA" 0.5.1
