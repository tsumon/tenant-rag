<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="tenant-rag v0.6.0 Dual-Mode Multi-Tenant Hybrid RAG">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090F1E"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#111C33"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="20%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowEmerald" cx="85%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="20" fill="url(#glowBlue)"/>
  <rect width="1200" height="320" rx="20" fill="url(#glowEmerald)"/>
  <rect x="1" y="1" width="1198" height="318" rx="19" fill="none" stroke="#24324B" stroke-width="1.5"/>

  <!-- Top accent bar -->
  <rect x="44" y="42" width="192" height="26" rx="13" fill="#172554" stroke="#3B82F6" stroke-opacity="0.5"/>
  <circle cx="60" cy="55" r="4" fill="#34D399"/>
  <text x="72" y="59" fill="#93C5FD" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">v0.6.0 · DUAL-MODE RAG</text>

  <!-- Title & tagline -->
  <text x="44" y="122" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="800" letter-spacing="-1">tenant-rag</text>
  <rect x="335" y="92" width="108" height="28" rx="8" fill="url(#accentGrad)" fill-opacity="0.18" stroke="#10B981" stroke-opacity="0.5"/>
  <text x="389" y="111" text-anchor="middle" fill="#6EE7B7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">ENTERPRISE</text>

  <text x="44" y="164" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="19" font-weight="500">
    Zero-dependency SQLite core + Physical-isolation Enterprise RAG Platform
  </text>
  <text x="44" y="194" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="15">
    每个租户的数据，严格隔离在自己的检索空间 · 物理分库 · 权限预过滤 · 二阶段重排 · 引用溯源
  </text>

  <!-- Bottom capability pills -->
  <g transform="translate(44, 232)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <rect x="0" y="0" width="136" height="32" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="68" y="20" text-anchor="middle" fill="#E2E8F0">Core: 0 Deps</text>

    <rect x="148" y="0" width="166" height="32" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="231" y="20" text-anchor="middle" fill="#93C5FD">Physical WAL Pool</text>

    <rect x="326" y="0" width="154" height="32" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="403" y="20" text-anchor="middle" fill="#6EE7B7">IAM + SHA-256 Audit</text>

    <rect x="492" y="0" width="174" height="32" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="579" y="20" text-anchor="middle" fill="#FDE68A">ACL · Rerank · SSE Chat</text>
  </g>

  <!-- Right architectural stack cards -->
  <g transform="translate(724, 42)">
    <!-- Card 1: React 19 UI -->
    <rect x="0" y="0" width="432" height="68" rx="12" fill="#131F38" stroke="#3B82F6" stroke-opacity="0.45"/>
    <circle cx="24" cy="24" r="6" fill="#60A5FA"/>
    <text x="40" y="28" fill="#F1F5F9" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">React 19 + TypeScript Dual Console</text>
    <text x="40" y="50" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="11.5">Platform Admin (4 views) · Tenant Workspace (5 views)</text>

    <!-- Connector -->
    <line x1="216" y1="68" x2="216" y2="86" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Card 2: Enterprise Gateway & Retrieval -->
    <rect x="0" y="86" width="432" height="84" rx="12" fill="#131F38" stroke="#10B981" stroke-opacity="0.45"/>
    <circle cx="24" cy="110" r="6" fill="#34D399"/>
    <text x="40" y="114" fill="#F1F5F9" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Enterprise Production Layer (FastAPI)</text>
    <text x="40" y="136" fill="#A7F3D0" font-family="ui-monospace, monospace" font-size="11.5">Scoped Keys · Metadata/ACL Filter · Rerank · Abstention</text>
    <text x="40" y="155" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="11.5">PDF/DOCX/HTML/CSV Parsers · Async Jobs · /metrics</text>

    <!-- Connector -->
    <line x1="216" y1="170" x2="216" y2="188" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Card 3: Core SDK + Physical Pool -->
    <rect x="0" y="188" width="432" height="58" rx="12" fill="#0D1629" stroke="#64748B" stroke-opacity="0.5"/>
    <circle cx="24" cy="212" r="6" fill="#FBBF24"/>
    <text x="40" y="216" fill="#F1F5F9" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Zero-Dep Core SDK + Per-Tenant WAL Pool</text>
    <text x="40" y="235" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="11.5">Cosine + FTS5 Trigram + RRF/Score · Hot Backup &amp; Restore</text>
  </g>
</svg>
